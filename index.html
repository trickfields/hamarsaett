<style>
:root{
  color-scheme: light;
  --surface-0:#f3f2ee; --surface-1:#fcfcfb; --surface-2:#ffffff;
  --line:#dcdad3; --line-strong:#b9b6ac;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#7c7a72;
  --accent:#2a78d6; --accent-soft:#e4eefb;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --neutral:#9a978d;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.07);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --surface-0:#121211; --surface-1:#1a1a19; --surface-2:#232322;
    --line:#33332f; --line-strong:#4d4c46;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8f8d83;
    --accent:#3987e5; --accent-soft:#1b2c42;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --neutral:#6f6d65;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-0:#121211; --surface-1:#1a1a19; --surface-2:#232322;
  --line:#33332f; --line-strong:#4d4c46;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8f8d83;
  --accent:#3987e5; --accent-soft:#1b2c42;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --neutral:#6f6d65;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--surface-0); color:var(--text-primary);
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- header ---------- */
header{
  position:absolute; inset:0 0 auto 0; z-index:30;
  display:flex; align-items:center; gap:12px; padding:10px 14px;
  background:color-mix(in srgb,var(--surface-1) 88%, transparent);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
}
.brand{min-width:0}
.brand h1{font-size:13.5px;margin:0;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:1px 0 0;font-size:11.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .short{display:none}
.spacer{flex:1}

/* ---------- search ---------- */
.search{position:relative;width:min(360px,42vw);flex:none}
.search input{
  width:100%;padding:9px 34px 9px 32px;border-radius:10px;
  border:1px solid var(--line-strong); background:var(--surface-2);
  color:var(--text-primary); font-size:13.5px; outline:none;
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;font-size:13px}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--text-muted);
  border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--surface-1)}
.results{
  position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:min(60vh,420px);overflow:auto;
  background:var(--surface-2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  display:none;padding:5px;
}
.results.on{display:block}
.res{padding:7px 9px;border-radius:8px;cursor:pointer;display:flex;gap:9px;align-items:center}
.res:hover,.res.sel{background:var(--accent-soft)}
.res .dot{width:8px;height:8px;border-radius:50%;flex:none}
.res .nm{font-size:13px;font-weight:550;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .yr{font-size:11.5px;color:var(--text-muted);flex:none;font-variant-numeric:tabular-nums}
.res .via{font-size:11px;color:var(--text-muted);display:block;font-weight:400}
.res-empty{padding:14px;font-size:12.5px;color:var(--text-muted);text-align:center}

/* ---------- tool buttons ---------- */
.tools{display:flex;gap:6px;flex:none}
.tb{
  background:var(--surface-2);border:1px solid var(--line-strong);border-radius:9px;
  padding:8px 11px;font-size:12.5px;font-weight:520;line-height:1;white-space:nowrap;
}
.tb:hover{border-color:var(--accent);color:var(--accent)}
.tb.icon{padding:8px 10px;min-width:34px}

/* ---------- stage ---------- */
#stage{position:absolute;inset:0;touch-action:none;cursor:grab;background:
  radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0) 0 0/26px 26px, var(--surface-0);}
#stage.drag{cursor:grabbing}
#svg{width:100%;height:100%;display:block}
.node{cursor:pointer}
.card{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:1}
.node:hover .card{stroke:var(--accent)}
.node.sel .card{stroke:var(--accent);stroke-width:2.5}
.node.line .card{stroke:var(--accent);stroke-width:1.8}
.node.dim{opacity:.28}
.nm{font-size:13px;font-weight:650;fill:var(--text-primary)}
.yr{font-size:11px;fill:var(--text-secondary);font-variant-numeric:tabular-nums}
.sp{font-size:11px;fill:var(--text-muted)}
.rel{font-size:10px;fill:var(--text-muted);font-style:italic}
.node.nb .card{stroke-dasharray:5 4;fill:var(--surface-1)}
.node.nb .nm{font-weight:600;fill:var(--text-secondary)}
.edge{fill:none;stroke:var(--line-strong);stroke-width:1.6;stroke-linejoin:round}
.edge.line{stroke:var(--accent);stroke-width:2.4}
.edge.dim{opacity:.22}
.tg{cursor:pointer}
.tg circle{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:1.4}
.tg:hover circle{stroke:var(--accent)}
.tg text{font-size:10.5px;font-weight:700;fill:var(--text-secondary);text-anchor:middle}
.tg.open text{fill:var(--text-muted)}
@keyframes pulse{0%{opacity:.85;r:0}70%{opacity:0}100%{opacity:0}}
.pulse{fill:none;stroke:var(--accent);stroke-width:3;animation:pulse 1.1s ease-out 2}

/* ---------- legend ---------- */
.legend{
  position:absolute;left:14px;bottom:14px;z-index:20;
  background:color-mix(in srgb,var(--surface-1) 92%, transparent);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  padding:9px 10px;max-width:230px;
}
.legend h3{margin:0 0 7px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);font-weight:650}
.lg{display:flex;align-items:center;gap:7px;padding:3px 5px;border-radius:6px;cursor:pointer;font-size:12px}
.lg:hover{background:var(--accent-soft)}
.lg .dot{width:9px;height:9px;border-radius:2px;flex:none}
.lg .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg .c{color:var(--text-muted);font-size:11px;font-variant-numeric:tabular-nums}
.lgnote{display:flex;align-items:center;gap:7px;margin-top:7px;padding-top:7px;
  border-top:1px solid var(--line);font-size:10.5px;color:var(--text-muted);line-height:1.35}
.lgnote .dash{width:14px;height:0;border-top:1.6px dashed var(--line-strong);flex:none}
.legend .hide{margin-top:6px;font-size:11px;color:var(--text-muted);background:none;border:none;padding:3px 5px}

/* ---------- panel ---------- */
#panel{
  position:absolute;top:var(--hh,56px);right:0;bottom:0;width:370px;z-index:25;
  background:var(--surface-1);border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  overflow:auto;padding:16px 18px 40px;
}
#panel.on{transform:none}
.pclose{position:absolute;top:12px;right:12px;background:none;border:none;font-size:20px;line-height:1;color:var(--text-muted)}
#panel h2{margin:2px 0 2px;font-size:19px;letter-spacing:-.015em;line-height:1.25;padding-right:26px}
.pref{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text-muted);margin-top:6px}
.pref .dot{width:8px;height:8px;border-radius:2px}
.pdates{margin:9px 0 0;font-size:13.5px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.pocc{margin:8px 0 0;font-size:13px;color:var(--text-secondary);line-height:1.5}
.corr{margin:8px 0 0;font-size:11.5px;color:var(--text-muted);line-height:1.45;
  border-left:2px solid var(--s4);padding:2px 0 2px 8px}
.sec{margin-top:20px}
.sec h4{margin:0 0 7px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);font-weight:650}
.mk{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:7px;background:var(--surface-2)}
.mk .lb{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:600}
.mk .nm2{font-size:14px;font-weight:600;margin-top:2px}
.mk .dt{font-size:12px;color:var(--text-secondary);margin-top:2px;font-variant-numeric:tabular-nums}
.mk .oc{font-size:12px;color:var(--text-muted);margin-top:3px;line-height:1.45}
.mk .pa{font-size:11px;color:var(--text-muted);margin-top:5px;line-height:1.45;border-top:1px solid var(--line);padding-top:5px}
.chip{
  display:block;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);
  border-radius:8px;padding:7px 10px;margin-bottom:5px;font-size:13px;
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip .y{color:var(--text-muted);font-size:11.5px;float:right;font-variant-numeric:tabular-nums}
.chip em{font-style:italic;color:var(--text-muted);font-size:11.5px}
.chip.nbchip{border-style:dashed}
.crumb{display:flex;flex-wrap:wrap;gap:3px;align-items:center;font-size:12px}
.crumb button{background:none;border:none;padding:2px 5px;border-radius:5px;color:var(--accent);font-size:12px}
.crumb button:hover{background:var(--accent-soft)}
.crumb span{color:var(--text-muted)}
.foot{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:var(--text-muted);line-height:1.5}

/* ---------- mobile ---------- */
@media (max-width:820px){
  header{flex-wrap:wrap;padding:8px 10px;gap:8px}
  .brand{order:1;flex:1 1 100%}
  .search{order:2;flex:1 1 auto;width:auto;min-width:0}
  .tools{order:3;flex:0 0 auto}
  .spacer{display:none}
  .search kbd{display:none}
  #panel{width:100%;top:auto;height:66vh;border-left:none;border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;transform:translateY(100%);box-shadow:var(--shadow)}
  #panel.on{transform:none}
  .legend{display:none}
  .brand .long{display:none}
  .brand .short{display:inline}
  .tb{padding:8px 9px;font-size:12px}
}

/* ---------- öruggt svæði þegar keyrt er sem app á síma ---------- */
header{padding-top:calc(10px + env(safe-area-inset-top,0px))}
#panel{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
@media (display-mode:standalone){ .search kbd{display:none} }

ert að minnast vinum sínum trygg og góð aldrei sást á gæðum grynnast með göfuglyndi studdi þjóð. Hjartagóð við hruma lýði hjálpar oft þeim rétti mund lagði á ráð með rausn og prýði raunamargri eyddi stund. Fyndi hún menn í ströngu stríði strax hún gladdi þeirra lund. Ungur hlaut ég móður mína missa í dauðans kalda bað kramdi hjarta kvíði og pína Kristín græddi meinið það um mig vafði arma sína og mér gekk í hennar stað. Hennar mæti maður líka mér þá gekk í föður stað aðstoð sýndi ástarríka yndisgeislum stráði að brast ei neitt á blessun slíka bið ég drottin launa það. Í fóstru minnar faðmi þýðum fann ég ungur hvíld og fró hún með ástartárum tíðum trúarljósið að mér dró með áminningarorðum blíðum undir lífsins vegferð bjó. Ýmsa hjörtu angur særa enginn gleðibjarmi skín þeirri látnu þakkir færa þetta hrós hjá lýðum dvín meðan öndin brjóstin bæra. Blessuð veri minning þín. Antoníus Sigurðsson Kristborg Stefánsdóttir Fædd 17. október 1909 – Dáin 4. október 1914. Hvíl, ó hvíl í friði Aftari röð f.v.: Herdís Þórlindsdóttir, Þóra Stefánsdóttir?, Sveinn Stefánsson,Kristín Stefánsdóttir, Stefán Stefánsson, Jónína Sigurðardóttir, Steinunn Einarsdóttir, Ásgeir Stefánsson, óþekktur á bak við Ásgeir. Fremri röð f.v.: Stefán Steinar Ólafsson, Hrefna Ólafsdóttir, Auður Stefánsdóttir, Ingimar Sveinsson,","br":8,"k":[],"ref":"1i","par":"Foreldrarnir.","u":[]},{"i":349,"p":103,"g":5,"n":"Heiðar Bliki Jóhannsson","b":"14. mars 2024","d":null,"pl":null,"o":"","br":3,"k":[],"ref":"5a","nb":1,"rel":"ekki blóðtengt","hdr":"Barn þeirra","via":"Jóhann Garðar Þorbjörnsson","u":[]},{"i":350,"p":106,"g":4,"n":"Elísabet Dröfn Kristjánsdóttir","b":"3. september 1982","d":null,"pl":null,"o":"","br":3,"k":[],"ref":"4a","nb":1,"rel":"ekki blóðtengt","hdr":"Barn Hallfríðar og Kristjáns Guðmundssonar, Reykjavík, f. 3. febrúar 1958","via":"Hallfríður María Pálsdóttir","u":[]},{"i":351,"p":106,"g":4,"n":"Benjamín Karl Guðjónsson","b":"26. mars 2015","d":null,"pl":null,"o":"","br":3,"k":[],"ref":"4a","n <script>
"use strict";
const P = JSON.parse(document.getElementById('data').textContent);
const byId = new Map(P.map(p => [p.i, p]));
const ROOT = P[0];

/* ---- branch colours: 6 real branches get hues, infants stay neutral ---- */
const HUES = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
const gen1 = P.filter(p => p.g === 1);
const branchCount = {}, branchName = {}, branchColor = {};
gen1.forEach((p, i) => { branchName[i] = p.n; branchCount[i] = 0; });
P.forEach(p => { if (p.br >= 0 && !p.nb) branchCount[p.br]++; });
let hi = 0;
gen1.forEach((p, i) => {
  branchColor[i] = branchCount[i] > 1 ? `var(${HUES[hi++ % 8]})` : 'var(--neutral)';
});
const colOf = p => p.br >= 0 ? branchColor[p.br] : 'var(--line-strong)';

/* ---- text helpers ---- */
const esc = s => (s == null ? '' : String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])));
const yearOf = s => { if (!s) return null; const m = String(s).match(/(\d{4})/); return m ? m[1] : null; };
function lifeShort(p){
  const b = yearOf(p.b), d = yearOf(p.d);
  if (p.note === 'andvana') return 'andvana ' + (b || '');
  if (b && d) return b + '–' + d;
  if (b) return 'f. ' + b;
  if (d) return 'd. ' + d;
  return '';
}
function lifeLong(p){
  const bits = [];
  if (p.b) bits.push('f. ' + p.b + (p.pl ? ' ' + p.pl : ''));
  else if (p.pl) bits.push(p.pl);
  if (p.d) bits.push('d. ' + p.d);
  if (p.note === 'andvana') bits.push('andvana');
  return bits.join(' · ');
}
const LBL = { maki:'Maki', barnsfaðir:'Barnsfaðir', barnsmóðir:'Barnsmóðir',
  sambýlismaður:'Sambýlismaður', sambýliskona:'Sambýliskona', single:'Barn' };
const labelOf = u => LBL[u.l] || (u.l ? u.l.charAt(0).toUpperCase() + u.l.slice(1) : 'Maki');

/* ---- text measurement + wrapping ---- */
const mc = document.createElement('canvas').getContext('2d');
const FONT_N = '650 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif';
const FONT_S = '11px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif';
function wrap(text, maxW, font, maxLines){
  mc.font = font;
  const words = String(text || '').split(' ');
  const lines = []; let cur = '';
  for (const w of words){
    const t = cur ? cur + ' ' + w : w;
    if (mc.measureText(t).width <= maxW || !cur) cur = t;
    else { lines.push(cur); cur = w; if (lines.length === maxLines - 1) break; }
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) lines.length = maxLines;
  if (lines.length === maxLines){
    let last = lines[maxLines - 1];
    const consumed = lines.join(' ');
    if (consumed.length < String(text).length && mc.measureText(last).width > maxW - 12){
      while (last.length > 3 && mc.measureText(last + '…').width > maxW) last = last.slice(0, -1);
      lines[maxLines - 1] = last + '…';
    }
  }
  return lines;
}
function clip(text, maxW, font){
  mc.font = font;
  let t = String(text || '');
  if (mc.measureText(t).width <= maxW) return t;
  while (t.length > 2 && mc.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}

/* ---- node metrics ---- */
const NW = 208, PAD = 11, GAPX = 22, GAPY = 58;
const metrics = new Map();
for (const p of P){
  const nameLines = wrap(p.n, NW - PAD * 2, FONT_N, 2);
  const spouses = p.u.filter(u => u.n).slice(0, 2);
  const spLines = spouses.map(u => clip('⚭ ' + u.n, NW - PAD * 2, FONT_S));
  const extraSp = p.u.filter(u => u.n).length - spouses.length;
  const relLine = p.nb ? clip(p.rel, NW - PAD * 2, FONT_S) : null;
  const h = PAD + nameLines.length * 16 + 15 + spLines.length * 14
          + (extraSp > 0 ? 13 : 0) + (relLine ? 13 : 0) + PAD - 3;
  metrics.set(p.i, { nameLines, spLines, extraSp, relLine, h });
}

/* ---- expansion state ---- */
const expanded = new Set();
P.forEach(p => { if (p.g <= 1) expanded.add(p.i); });
const visKids = p => (expanded.has(p.i) ? p.k : []);

/* ---- layout (works in both orientations) ---- */
let orient = 'v';                       // 'v' = niður, 'h' = til hliðar
const pos = new Map();
let bbox = { w: 0, h: 0 };
function layout(){
  pos.clear();
  const vert = orient === 'v';
  const gapC = vert ? GAPX : 16;        // gap along the sibling axis
  const gapD = vert ? GAPY : 74;        // gap between generations
  const crossOf = p => vert ? NW : metrics.get(p.i).h;

  const spanOf = p => {
    const kids = visKids(p);
    if (!kids.length) return crossOf(p);
    let w = 0;
    kids.forEach((k, i) => { w += spanOf(byId.get(k)) + (i ? gapC : 0); });
    return Math.max(crossOf(p), w);
  };
  // depth (generation) offsets
  const lvSize = [];
  (function depth(p, lv){
    lvSize[lv] = Math.max(lvSize[lv] || 0, vert ? metrics.get(p.i).h : NW);
    visKids(p).forEach(k => depth(byId.get(k), lv + 1));
  })(ROOT, 0);
  const lvPos = []; let acc = 0;
  for (let i = 0; i < lvSize.length; i++){ lvPos[i] = acc; acc += lvSize[i] + gapD; }

  (function place(p, start, lv){
    const span = spanOf(p), c = crossOf(p), m = metrics.get(p.i);
    const off = start + span / 2 - c / 2;
    pos.set(p.i, vert
      ? { x: off, y: lvPos[lv], w: NW, h: m.h, lv }
      : { x: lvPos[lv], y: off, w: NW, h: m.h, lv });
    const kids = visKids(p);
    if (kids.length){
      const total = kids.reduce((s, k, i) => s + spanOf(byId.get(k)) + (i ? gapC : 0), 0);
      let cx = start + (span - total) / 2;
      kids.forEach(k => { const kw = spanOf(byId.get(k)); place(byId.get(k), cx, lv + 1); cx += kw + gapC; });
    }
  })(ROOT, 0, 0);

  let maxX = 0, maxY = 0;
  pos.forEach(v => { maxX = Math.max(maxX, v.x + v.w); maxY = Math.max(maxY, v.y + v.h); });
  bbox = { w: maxX, h: maxY };
}

/* ---- render ---- */
const svg = document.getElementById('svg');
const gEdges = document.getElementById('edges');
const gNodes = document.getElementById('nodes');
let selected = null, lineage = new Set(), branchFocus = null;

function render(){
  layout();
  const eh = [], nh = [];
  for (const p of P){
    const a = pos.get(p.i); if (!a) continue;
    for (const kid of visKids(p)){
      const b = pos.get(kid); if (!b) continue;
      let d;
      if (orient === 'v'){
        const x1 = a.x + a.w / 2, y1 = a.y + a.h, x2 = b.x + b.w / 2, y2 = b.y;
        const my = y1 + (y2 - y1) / 2;
        const r = Math.min(11, Math.abs(x2 - x1) / 2, (y2 - y1) / 2);
        if (Math.abs(x2 - x1) < 1) d = `M${x1},${y1}V${y2}`;
        else {
          const s = x2 > x1 ? 1 : -1;
          d = `M${x1},${y1}V${my - r}Q${x1},${my} ${x1 + s * r},${my}H${x2 - s * r}Q${x2},${my} ${x2},${my + r}V${y2}`;
        }
      } else {
        const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2;
        const mx = x1 + (x2 - x1) / 2;
        const r = Math.min(11, Math.abs(y2 - y1) / 2, (x2 - x1) / 2);
        if (Math.abs(y2 - y1) < 1) d = `M${x1},${y1}H${x2}`;
        else {
          const s = y2 > y1 ? 1 : -1;
          d = `M${x1},${y1}H${mx - r}Q${mx},${y1} ${mx},${y1 + s * r}V${y2 - s * r}Q${mx},${y2} ${mx + r},${y2}H${x2}`;
        }
      }
      const onLine = lineage.has(p.i) && lineage.has(kid);
      const dim = branchFocus !== null && byId.get(kid).br !== branchFocus;
      eh.push(`<path class="edge${onLine ? ' line' : ''}${dim ? ' dim' : ''}" d="${d}"/>`);
    }
  }
  for (const p of P){
    const a = pos.get(p.i); if (!a) continue;
    const m = metrics.get(p.i);
    const col = colOf(p);
    const sel = selected === p.i;
    const onLine = lineage.has(p.i);
    const dim = branchFocus !== null && p.br !== branchFocus && p.g > 0;
    let y = a.y + PAD + 12;
    let t = '';
    m.nameLines.forEach(l => { t += `<text class="nm" x="${a.x + PAD}" y="${y}">${esc(l)}</text>`; y += 16; });
    const ls = lifeShort(p);
    if (ls) { t += `<text class="yr" x="${a.x + PAD}" y="${y + 1}">${esc(ls)}</text>`; }
    y += 15;
    if (m.relLine){ t += `<text class="rel" x="${a.x + PAD}" y="${y}">${esc(m.relLine)}</text>`; y += 13; }
    m.spLines.forEach(l => { t += `<text class="sp" x="${a.x + PAD}" y="${y}">${esc(l)}</text>`; y += 14; });
    if (m.extraSp > 0) t += `<text class="sp" x="${a.x + PAD}" y="${y}">+${m.extraSp} maki til viðbótar</text>`;
    let tg = '';
    if (p.k.length){
      const open = expanded.has(p.i);
      const tgx = orient === 'v' ? a.x + a.w / 2 : a.x + a.w;
      const tgy = orient === 'v' ? a.y + a.h : a.y + a.h / 2;
      tg = `<g class="tg${open ? ' open' : ''}" data-tg="${p.i}" transform="translate(${tgx},${tgy})">
        <circle r="11"/><text y="3.6">${open ? '–' : '+' + p.k.length}</text></g>`;
    }
    nh.push(`<g class="node${sel ? ' sel' : ''}${onLine && !sel ? ' line' : ''}${dim ? ' dim' : ''}${p.nb ? ' nb' : ''}" data-id="${p.i}">
      <rect class="card" x="${a.x}" y="${a.y}" width="${a.w}" height="${a.h}" rx="11"/>
      <path d="M${a.x + 11},${a.y} h-6 a5,5 0 0 0 -5,5 v${a.h - 10} a5,5 0 0 0 5,5 h6 z" fill="${col}"${p.nb ? ' opacity=".38"' : ''}/>
      ${t}${sel ? `<circle class="pulse" cx="${a.x + a.w / 2}" cy="${a.y + a.h / 2}" r="0"/>` : ''}${tg}
    </g>`);
  }
  gEdges.innerHTML = eh.join('');
  gNodes.innerHTML = nh.join('');
}

/* ---- viewport ---- */
const view = document.getElementById('view');
const stage = document.getElementById('stage');
let tx = 0, ty = 0, sc = 1;
const applyT = () => view.setAttribute('transform', `translate(${tx},${ty}) scale(${sc})`);
const easeOut = t => 1 - Math.pow(1 - t, 3);
let anim = null;
function animateTo(nx, ny, ns, ms = 620){
  if (anim) cancelAnimationFrame(anim);
  const sx = tx, sy = ty, ss = sc, t0 = performance.now();
  (function step(now){
    const k = Math.min(1, (now - t0) / ms), e = easeOut(k);
    tx = sx + (nx - sx) * e; ty = sy + (ny - sy) * e; sc = ss + (ns - ss) * e;
    applyT();
    if (k < 1) anim = requestAnimationFrame(step); else anim = null;
  })(performance.now());
}
const headerEl = document.querySelector('header');
function headerH(){
  const h = headerEl.offsetHeight;
  document.documentElement.style.setProperty('--hh', h + 'px');
  return h;
}
/* the area of the stage that is actually visible next to header + panel */
function viewRect(){
  const pn = document.getElementById('panel');
  const on = pn.classList.contains('on'), wide = window.innerWidth > 820;
  const top = headerH();
  return {
    left: 0, top,
    w: stage.clientWidth - (on && wide ? pn.offsetWidth : 0),
    h: stage.clientHeight - top - (on && !wide ? pn.offsetHeight : 0)
  };
}
function centerOn(id, scale, ms){
  const a = pos.get(id); if (!a) return;
  const r = viewRect();
  const s = scale != null ? scale : Math.min(1.05, sc < 0.75 ? 1 : sc);
  animateTo(r.left + r.w / 2 - (a.x + a.w / 2) * s, r.top + r.h / 2 - (a.y + a.h / 2) * s, s, ms);
}
function fitAll(ms = 620){
  const r = viewRect();
  const s = Math.max(0.05, Math.min(1.1, Math.min((r.w - 60) / bbox.w, (r.h - 60) / bbox.h)));
  animateTo(r.left + r.w / 2 - bbox.w / 2 * s, r.top + Math.max(24, (r.h - bbox.h * s) / 2), s, ms);
}

/* pan + zoom */
let drag = null;
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('.tg') || e.target.closest('.node')) return;
  drag = { x: e.clientX, y: e.clientY, tx, ty };
  stage.classList.add('drag'); stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  tx = drag.tx + (e.clientX - drag.x); ty = drag.ty + (e.clientY - drag.y); applyT();
});
const endDrag = () => { drag = null; stage.classList.remove('drag'); };
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('wheel', e => {
  e.preventDefault();
  if (anim){ cancelAnimationFrame(anim); anim = null; }
  const f = Math.exp(-e.deltaY * (e.ctrlKey ? 0.012 : 0.0022));
  const ns = Math.max(0.05, Math.min(3, sc * f));
  const r = stage.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  tx = mx - (mx - tx) * (ns / sc); ty = my - (my - ty) * (ns / sc); sc = ns; applyT();
}, { passive: false });
// pinch
let pinch = null;
stage.addEventListener('touchstart', e => {
  if (e.touches.length === 2){
    const [a, b] = e.touches;
    pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), sc,
      cx: (a.clientX + b.clientX) / 2, cy: (a.clientY + b.clientY) / 2, tx, ty };
  }
}, { passive: true });
stage.addEventListener('touchmove', e => {
  if (pinch && e.touches.length === 2){
    e.preventDefault();
    const [a, b] = e.touches;
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    const ns = Math.max(0.05, Math.min(3, pinch.sc * (d / pinch.d)));
    const r = stage.getBoundingClientRect(), mx = pinch.cx - r.left, my = pinch.cy - r.top;
    tx = mx - (mx - pinch.tx) * (ns / pinch.sc); ty = my - (my - pinch.ty) * (ns / pinch.sc);
    sc = ns; applyT();
  }
}, { passive: false });
stage.addEventListener('touchend', () => { pinch = null; }, { passive: true });

/* ---- selection ---- */
function ancestors(id){
  const out = []; let p = byId.get(id);
  while (p && p.p != null){ p = byId.get(p.p); out.push(p.i); }
  return out;
}
function select(id, opts = {}){
  const anc = ancestors(id);
  anc.forEach(a => expanded.add(a));
  if (opts.open !== false && byId.get(id).k.length) expanded.add(id);
  selected = id;
  lineage = new Set([id, ...anc]);
  render();
  showPanel(id);
  requestAnimationFrame(() => centerOn(id, opts.scale, opts.ms));
  // sumir vafrar loka á sögubreytingar þegar skrá er opnuð beint af disk
  try { history.replaceState(null, '', '#p' + id); } catch (e) {}
}

/* ---- panel ---- */
const panel = document.getElementById('panel');
function showPanel(id){
  const p = byId.get(id);
  const anc = ancestors(id).reverse();
  const crumb = anc.map(a => `<button data-go="${a}">${esc(byId.get(a).n)}</button>`).join('<span>›</span>');
  const kids = p.k.map(k => { const c = byId.get(k);
    return `<button class="chip${c.nb ? ' nbchip' : ''}" data-go="${k}">${esc(c.n)}${
      c.nb ? `<em> · ${esc(c.rel)}</em>` : ''}<span class="y">${esc(lifeShort(c))}</span></button>`; }).join('');
  const unions = p.u.filter(u => u.n).map(u => `
    <div class="mk">
      <div class="lb">${esc(labelOf(u))}${u.nt ? ' · ' + esc(u.nt) : ''}</div>
      <div class="nm2">${esc(u.n)}</div>
      ${(u.b || u.d || u.pl) ? `<div class="dt">${esc(lifeLong(u))}</div>` : ''}
      ${u.o ? `<div class="oc">${esc(u.o)}</div>` : ''}
      ${u.pa ? `<div class="pa">${esc(u.pa)}</div>` : ''}
    </div>`).join('');
  panel.innerHTML = `
    <button class="pclose" aria-label="Loka">×</button>
    <h2>${esc(p.n)}</h2>
    <div class="pref"><span class="dot" style="background:${colOf(p)}"></span>
      ${p.br >= 0 ? 'Grein: ' + esc(branchName[p.br]) : 'Ættfaðir'}${p.nb ? '' : ' · ' + esc(p.ref)} · ${p.g}. ættliður</div>
    <div class="pdates">${esc(lifeLong(p)) || '—'}</div>
    ${p.al ? `<div class="pocc" style="font-size:12px;color:var(--text-muted)">Í ritinu: ${esc(p.al)}</div>` : ''}
    ${p.nb ? `<div class="corr">Ekki blóðtengt ættinni — ${esc(p.rel)}. ${p.add
      ? esc(p.hdr) + '.'
      : `Í ritinu talið upp undir „${esc(p.hdr)}“${
          p.via ? ' — maki foreldris: ' + esc(p.via.replace(/^\(.*?\)\s*/, '')) : ''}, án eigin niðjatalsfærslu.`}</div>` : ''}
    ${p.corr ? `<div class="corr">Leiðrétt frá ritinu · ${esc(p.corr)}</div>` : ''}
    ${p.add ? `<div class="corr">Viðbót · ${esc(p.add)}</div>` : ''}
    ${p.o ? `<p class="pocc">${esc(p.o)}</p>` : ''}
    ${p.par ? `<p class="pocc" style="font-size:12px;color:var(--text-muted)">${esc(p.par)}</p>` : ''}
    ${anc.length ? `<div class="sec"><h4>Ættarlína frá Stefáni</h4><div class="crumb">${crumb}</div></div>` : ''}
    ${unions ? `<div class="sec"><h4>Makar</h4>${unions}</div>` : ''}
    ${kids ? `<div class="sec"><h4>Börn (${p.k.length})</h4>${kids}</div>` : ''}
    <div class="foot">Heimild: <em>Niðjatal Stefáns Sigurðssonar og Steinunnar Einarsdóttur á Hamri í Hamarsfirði</em>,
    tekið saman af Önnu Margréti Birgisdóttur, Breiðdalsvík, 11. apríl 2025.</div>`;
  panel.classList.add('on');
}
panel.addEventListener('click', e => {
  if (e.target.closest('.pclose')){ panel.classList.remove('on'); return; }
  const b = e.target.closest('[data-go]');
  if (b) select(+b.dataset.go);
});

/* ---- node clicks ---- */
gNodes.addEventListener('click', e => {
  const tg = e.target.closest('.tg');
  if (tg){
    const id = +tg.dataset.tg;
    expanded.has(id) ? expanded.delete(id) : expanded.add(id);
    render(); return;
  }
  const n = e.target.closest('.node');
  if (n) select(+n.dataset.id, { open: false, scale: sc, ms: 380 });
});

/* ---- search ---- */
const norm = s => String(s || '').toLowerCase()
  .normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/þ/g, 'th').replace(/ð/g, 'd').replace(/æ/g, 'ae').replace(/ö/g, 'o');
const index = P.map(p => ({
  id: p.i, n: norm(p.n) + (p.al ? ' ' + norm(p.al) : ''),
  y: (yearOf(p.b) || '') + ' ' + (yearOf(p.d) || ''),
  sp: p.u.filter(u => u.n).map(u => ({ raw: u.n, n: norm(u.n) }))
}));
const qEl = document.getElementById('q'), resEl = document.getElementById('res');
let curRes = [], selRes = 0;
function search(term){
  const t = norm(term).trim();
  if (t.length < 1) return [];
  const words = t.split(/\s+/);
  const out = [];
  for (const it of index){
    const hitSelf = words.every(w => it.n.includes(w) || it.y.includes(w));
    let via = null;
    if (!hitSelf){
      const s = it.sp.find(s => words.every(w => s.n.includes(w)));
      if (s) via = s.raw; else continue;
    }
    const starts = it.n.startsWith(words[0]);
    const wordStart = new RegExp('(^|\\s)' + words[0].replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).test(it.n);
    out.push({ id: it.id, via, score: (hitSelf ? 0 : 40) + (starts ? 0 : wordStart ? 4 : 12) + it.n.length * 0.01 });
  }
  out.sort((a, b) => a.score - b.score);
  return out.slice(0, 40);
}
function drawRes(){
  if (!curRes.length){
    resEl.innerHTML = qEl.value.trim() ? '<div class="res-empty">Ekkert nafn fannst</div>' : '';
    resEl.classList.toggle('on', !!qEl.value.trim());
    return;
  }
  resEl.innerHTML = curRes.map((r, i) => {
    const p = byId.get(r.id);
    return `<div class="res${i === selRes ? ' sel' : ''}" data-id="${r.id}">
      <span class="dot" style="background:${colOf(p)}"></span>
      <span class="nm">${esc(p.n)}${r.via ? `<span class="via">maki: ${esc(r.via)}</span>` : ''}</span>
      <span class="yr">${esc(lifeShort(p))}</span></div>`;
  }).join('');
  resEl.classList.add('on');
  const s = resEl.querySelector('.res.sel');
  if (s) s.scrollIntoView({ block: 'nearest' });
}
qEl.addEventListener('input', () => { curRes = search(qEl.value); selRes = 0; drawRes(); });
qEl.addEventListener('focus', () => { if (qEl.value.trim()){ curRes = search(qEl.value); drawRes(); } });
qEl.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown'){ e.preventDefault(); selRes = Math.min(selRes + 1, curRes.length - 1); drawRes(); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); selRes = Math.max(selRes - 1, 0); drawRes(); }
  else if (e.key === 'Enter'){ e.preventDefault(); if (curRes[selRes]) pick(curRes[selRes].id); }
  else if (e.key === 'Escape'){ resEl.classList.remove('on'); qEl.blur(); }
});
resEl.addEventListener('click', e => { const r = e.target.closest('.res'); if (r) pick(+r.dataset.id); });
function pick(id){
  resEl.classList.remove('on');
  branchFocus = null; drawLegend();
  select(id, { open: true, scale: 1, ms: 700 });
  qEl.blur();
}
document.addEventListener('click', e => { if (!e.target.closest('.search')) resEl.classList.remove('on'); });
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== qEl){ e.preventDefault(); qEl.focus(); qEl.select(); }
  if (e.key === 'Escape'){ panel.classList.remove('on'); }
});

/* ---- legend ---- */
function drawLegend(){
  const rows = gen1.filter(p => branchCount[p.br] > 1).map(p => `
    <div class="lg" data-br="${p.br}">
      <span class="dot" style="background:${branchColor[p.br]}"></span>
      <span class="n">${esc(p.n)}</span><span class="c">${branchCount[p.br]}</span></div>`).join('');
  document.getElementById('legend').innerHTML =
    `<h3>Greinar — börn Stefáns og Steinunnar</h3>${rows}` +
    `<div class="lgnote"><span class="dash"></span>Slitin lína = barn úr ritinu sem er ekki blóðtengt</div>` +
    (branchFocus !== null ? '<button class="hide">← sýna allar greinar</button>' : '');
}
document.getElementById('legend').addEventListener('click', e => {
  if (e.target.closest('.hide')){ branchFocus = null; drawLegend(); render(); return; }
  const l = e.target.closest('.lg'); if (!l) return;
  const br = +l.dataset.br;
  branchFocus = branchFocus === br ? null : br;
  if (branchFocus !== null){
    const head = gen1.find(p => p.br === br);
    P.forEach(p => { if (p.br === br) expanded.add(p.i); });
    expanded.add(ROOT.i);
    drawLegend(); render();
    selected = head.i; lineage = new Set([head.i, ROOT.i]); render();
    showPanel(head.i); requestAnimationFrame(() => centerOn(head.i, 0.75, 620));
  } else { drawLegend(); render(); }
});

document.getElementById('btnOrient').addEventListener('click', e => {
  orient = orient === 'v' ? 'h' : 'v';
  e.target.textContent = orient === 'v' ? '⇅' : '⇄';
  e.target.title = orient === 'v' ? 'Snúa tré til hliðar' : 'Snúa tré niður';
  render();
  const focus = selected != null && pos.has(selected) ? selected : ROOT.i;
  centerOn(focus, Math.max(Math.min(sc, 1), 0.55), 500);
});
document.getElementById('btnHome').addEventListener('click', () => {
  branchFocus = null; drawLegend();
  selected = ROOT.i; lineage = new Set([ROOT.i]); render();
  showPanel(ROOT.i); requestAnimationFrame(() => centerOn(ROOT.i, 1, 620));
});
document.getElementById('btnFit').addEventListener('click', () => fitAll());
document.getElementById('btnTheme').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
});

/* ---- boot ---- */
const nBlood = P.filter(p => !p.nb).length, nExtra = P.length - nBlood;
document.getElementById('cnt').textContent =
  nBlood.toLocaleString('is-IS') + ' niðjar' + (nExtra ? ' · ' + nExtra + ' önnur börn úr ritinu' : '') + ' · 6 ættliðir';
drawLegend();
render();
let hash = null;
try { hash = location.hash.match(/^#p(\d+)$/); } catch (e) {}
if (hash && byId.has(+hash[1])) select(+hash[1], { scale: 1, ms: 10 });
else {
  // open on the ancestor couple at a readable size, not squeezed to fit
  const r = viewRect();
  const s = r.w < 700 ? 0.8 : 0.92;
  const a = pos.get(ROOT.i);
  sc = s; tx = r.w / 2 - (a.x + a.w / 2) * s;
  ty = r.top + Math.max(28, Math.min(70, (r.h - bbox.h * s) / 2)); applyT();
}
addEventListener('resize', () => { headerH(); render(); });
</script>

/* skráir vinnuþjón svo appið virki án nettengingar eftir fyrstu heimsókn */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
